name: signal-bot

on:
  workflow_dispatch:          # Cloudflare triggers this every 5 minutes (fast runs)
  schedule:
    - cron: "7 * * * *"       # hourly backup in case Cloudflare is not set up or is down

concurrency:
  group: signal-bot           # never two runs at once (they share state.json)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot.py

      - name: Save state
        if: always()          # state is saved even when the run above failed
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A -- 'state*'
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "state $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
